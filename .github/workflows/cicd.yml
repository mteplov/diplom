name: CI/CD

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

  workflow_dispatch:

env:
  TF_IN_AUTOMATION: "true"

  YC_SERVICE_ACCOUNT_KEY: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}

  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  TF_VAR_cloud_id: ${{ vars.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
  TF_VAR_zone: ${{ vars.YC_ZONE }}

  YC_SERVICE_ACCOUNT_KEY_FILE: /tmp/terraform-sa-key.json

  TF_VAR_password_hash: ${{ secrets.TF_VAR_PASSWORD_HASH }}
  TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}

  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

  REGISTRY: cr.yandex
  REGISTRY_ID: crp6gcfckbknlsc51u2f
  IMAGE_NAME: diplom-app


jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: self-hosted

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Terraform version
        run: terraform version


      - name: Configure Terraform provider
        run: cp "$GITHUB_WORKSPACE/terraform/.terraformrc" "$HOME/.terraformrc"


      - name: Configure Yandex Cloud credentials
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > /tmp/terraform-sa-key.json
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=/tmp/terraform-sa-key.json" >> $GITHUB_ENV

      - name: Terraform init
        run: |
          terraform init \
            -input=false \
            -no-color \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}"


      - name: Terraform fmt
        run: terraform fmt -check -recursive


      - name: Terraform validate
        run: terraform validate -no-color


      - name: Terraform plan
        run: terraform plan -input=false -no-color



  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: self-hosted

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Terraform version
        run: terraform version


      - name: Configure Terraform provider
        run: cp "$GITHUB_WORKSPACE/terraform/.terraformrc" "$HOME/.terraformrc"


      - name: Configure Yandex Cloud service account
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > /tmp/terraform-sa-key.json


      - name: Terraform init
        run: |
          terraform init \
            -input=false \
            -no-color \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}"


      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color



  docker-build:
    name: Docker Build and Push
    needs: terraform-apply

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: self-hosted


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Check Docker
        run: |
          docker --version
          docker info >/dev/null
          echo DOCKER_OK



      - name: Set Docker image tag
        shell: bash
        run: |

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="${GITHUB_SHA::7}"
          fi

          IMAGE="${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "IMAGE=${IMAGE}"



      - name: Login to Yandex Container Registry
        env:
          YC_SERVICE_ACCOUNT_KEY: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}

        run: |
          echo "$YC_TOKEN" | docker login \
            --username iam \
            --password-stdin \
            "$REGISTRY"



      - name: Build Docker image
        run: |
          docker build \
            --provenance=false \
            -t "${IMAGE}" \
            ./app



      - name: Push Docker image
        run: |
          docker push "${IMAGE}"



  kubernetes-deploy:

    name: Deploy to Kubernetes

    needs: docker-build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: self-hosted


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Set Docker image

        shell: bash

        run: |

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="${GITHUB_SHA::7}"
          fi

          IMAGE="${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "Deploy image:"
          echo "${IMAGE}"



      - name: Kubernetes access

        run: |

          kubectl cluster-info
          kubectl get nodes



      - name: Refresh Yandex registry secret

        env:

          YC_SERVICE_ACCOUNT_KEY: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}

        run: |

          kubectl create secret docker-registry yc-registry-secret \
            --docker-server=cr.yandex \
            --docker-username=iam \
            --docker-password="$YC_TOKEN" \
            --namespace=default \
            --dry-run=client \
            -o yaml | kubectl apply -f -



      - name: Apply Kubernetes manifests

        run: |

          kubectl apply -f kubernetes/app/service.yaml
          kubectl apply -f kubernetes/app/deployment.yaml



      - name: Deploy application image

        run: |

          kubectl set image deployment/diplom-app \
            diplom-app="${IMAGE}"



      - name: Rollout status

        run: |

          kubectl rollout status deployment/diplom-app --timeout=5m



      - name: Show deployment

        run: |

          kubectl get deployment diplom-app
          kubectl get pods -l app=diplom-app -o wide



      - name: Show deployed image

        run: |

          kubectl get deployment diplom-app \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'



      - name: Test application

        run: |

          curl -I http://127.0.0.1/app
