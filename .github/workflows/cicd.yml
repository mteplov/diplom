name: CI/CD

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

  workflow_dispatch:

env:
  TF_IN_AUTOMATION: "true"

  YC_TOKEN: ${{ secrets.YC_TOKEN }}

  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  TF_VAR_cloud_id: ${{ vars.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
  TF_VAR_zone: ${{ vars.YC_ZONE }}

  TF_VAR_password_hash: ${{ secrets.TF_VAR_PASSWORD_HASH }}
  TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}

  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

  REGISTRY: cr.yandex
  REGISTRY_ID: crp6gcfckbknlsc51u2f
  IMAGE_NAME: diplom-app

jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: self-hosted

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Terraform version
        run: terraform version

      - name: Configure Terraform provider installation
        run: cp "$GITHUB_WORKSPACE/terraform/.terraformrc" "$HOME/.terraformrc"

      - name: Terraform init
        run: |
          terraform init \
            -input=false \
            -no-color \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color


  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: self-hosted

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Terraform version
        run: terraform version

      - name: Configure Terraform provider installation
        run: cp "$GITHUB_WORKSPACE/terraform/.terraformrc" "$HOME/.terraformrc"

      - name: Terraform init
        run: |
          terraform init \
            -input=false \
            -no-color \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color


  docker-build:
    name: Docker Build and Push
    needs: terraform-apply
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker info >/dev/null
          echo "DOCKER_OK"

      - name: Set Docker image
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="${GITHUB_SHA::7}"
          fi
          IMAGE="${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "Docker image:"
          echo "${IMAGE}"

      - name: Login to Yandex Container Registry
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          echo "$YC_TOKEN" | docker login \
            --username iam \
            --password-stdin \
            "$REGISTRY"

      - name: Build Docker image
        run: |
          docker build \
            --provenance=false \
            -t "${IMAGE}" \
            ./app

      - name: Push Docker image
        run: docker push "${IMAGE}"


  kubernetes-deploy:
    name: Deploy to Kubernetes
    needs: docker-build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker image
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="${GITHUB_SHA::7}"
          fi
          IMAGE="${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "Deploying:"
          echo "${IMAGE}"

      - name: Check kubectl
        run: kubectl version --client

      - name: Check Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Refresh Kubernetes registry secret
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          kubectl create secret docker-registry yc-registry-secret \
            --docker-server=cr.yandex \
            --docker-username=iam \
            --docker-password="$YC_TOKEN" \
            --namespace=default \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/app/service.yaml
          kubectl apply -f kubernetes/app/deployment.yaml

      - name: Deploy application image
        run: |
          kubectl set image deployment/diplom-app \
            diplom-app="${IMAGE}"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/diplom-app --timeout=5m

      - name: Show deployment
        run: |
          kubectl get deployment diplom-app
          kubectl get pods -l app=diplom-app -o wide

      - name: Show deployed image
        run: |
          kubectl get deployment diplom-app \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Test application
        run: |
          curl -I http://127.0.0.1/app
