name: Docker Build and Deploy

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

  workflow_dispatch:

env:
  REGISTRY: cr.yandex
  REGISTRY_ID: crp6gcfckbknlsc51u2f
  IMAGE_NAME: diplom-app

jobs:
  build:
    name: Build and push Docker image
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker info >/dev/null
          echo "DOCKER_OK"

      - name: Login to Yandex Container Registry
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          echo "$YC_TOKEN" | docker login \
            --username iam \
            --password-stdin \
            "$REGISTRY"

      - name: Set Docker image tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="${GITHUB_SHA}"
          fi

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_ENV"

          echo "Docker image: ${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE}" \
            ./app

      - name: Push Docker image
        run: |
          docker push "${IMAGE}"

  deploy:
    name: Deploy tagged image to Kubernetes
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker image
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_REF_NAME}"
          echo "IMAGE=${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_ENV"

          echo "Deploying image:"
          echo "${REGISTRY}/${REGISTRY_ID}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Check kubectl
        run: |
          kubectl version --client

      - name: Check Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Refresh Kubernetes registry secret
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          kubectl create secret docker-registry yc-registry-secret \
            --docker-server=cr.yandex \
            --docker-username=iam \
            --docker-password="$YC_TOKEN" \
            --namespace=default \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy application image
        run: |
          kubectl set image deployment/diplom-app \
            diplom-app="${IMAGE}"

      - name: Wait for application rollout
        run: |
          kubectl rollout status deployment/diplom-app --timeout=5m

      - name: Show application deployment
        run: |
          kubectl get deployment diplom-app
          kubectl get pods -l app=diplom-app -o wide

      - name: Show deployed image
        run: |
          kubectl get deployment diplom-app \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
