name: Docker Build

on:
  push:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t diplom-app:${{ github.sha }} \
            ./app

      - name: Show images
        run: |
          docker images
