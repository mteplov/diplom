---
- name: Install ingress-nginx
  hosts: kube_master
  become: true

  vars:
    ingress_nginx_chart_version: "4.15.1"

  tasks:

    - name: Add ingress-nginx Helm repository
      become_user: teplov
      command: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"

    - name: Update Helm repositories
      become_user: teplov
      command: helm repo update
      changed_when: false

    - name: Install ingress-nginx
      become_user: teplov
      command: >
        helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
        --namespace ingress-nginx
        --create-namespace
        --version {{ ingress_nginx_chart_version }}
        --set controller.kind=DaemonSet
        --set controller.hostNetwork=true
        --set controller.dnsPolicy=ClusterFirstWithHostNet
        --set controller.service.type=ClusterIP
        --set controller.tolerations[0].key=node-role.kubernetes.io/control-plane
        --set controller.tolerations[0].operator=Exists
        --set controller.tolerations[0].effect=NoSchedule
        --wait
        --timeout 5m

    - name: Check ingress-nginx pods
      become_user: teplov
      command: kubectl get pods -n ingress-nginx -o wide
      register: ingress_pods
      changed_when: false

    - name: Show ingress-nginx pods
      debug:
        var: ingress_pods.stdout

    - name: Check ingress-nginx service
      become_user: teplov
      command: kubectl get svc -n ingress-nginx
      register: ingress_services
      changed_when: false

    - name: Show ingress-nginx service
      debug:
        var: ingress_services.stdout
