---
- name: Install ingress-nginx
  hosts: kube_master
  become: true

  vars:
    ingress_nginx_chart_version: "4.15.1"

  tasks:

    - name: Add ingress-nginx Helm repository
      become_user: teplov
      command: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"

    - name: Update Helm repositories
      become_user: teplov
      command: helm repo update
      changed_when: false

    - name: Install ingress-nginx
      become_user: teplov
      command: >
        helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx
        --namespace ingress-nginx
        --create-namespace
        --version {{ ingress_nginx_chart_version }}
        --set controller.replicaCount=2
        --set controller.service.type=NodePort
        --set controller.service.nodePorts.http=30545
        --set controller.service.nodePorts.https=31678
        --wait
        --timeout 5m

    - name: Check ingress-nginx pods
      become_user: teplov
      command: kubectl get pods -n ingress-nginx
      register: ingress_pods
      changed_when: false

    - name: Show ingress-nginx pods
      debug:
        var: ingress_pods.stdout
